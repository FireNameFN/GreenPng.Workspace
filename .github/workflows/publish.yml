name: Publish

on:
  push:
    tags: "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0
    - name: Restore
      run: dotnet restore GreenPng.Tests
    - name: Build
      run: dotnet build GreenPng.Tests -c Release --no-restore
    - name: Test
      run: dotnet run GreenPng.Tests -c Release --no-build
    - name: Pack
      run: dotnet pack GreenPng --no-build -o GreenPng.nupkg
    - name: Publish
      run: dotnet nuget push GreenPng.nupkg --api-key {{ $NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
